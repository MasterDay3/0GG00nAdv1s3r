<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Dueboard bee</title>
  <defs>
    <radialGradient id="body" cx="0.36" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffe680"/>
      <stop offset="0.55" stop-color="#ffc21a"/>
      <stop offset="1" stop-color="#e08a00"/>
    </radialGradient>
    <radialGradient id="wing" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#bfe3f7"/>
    </radialGradient>
    <clipPath id="clip"><ellipse cx="31" cy="38" rx="23" ry="19"/></clipPath>
  </defs>
  <!-- wings -->
  <ellipse cx="24" cy="15" rx="9" ry="12" transform="rotate(-22 24 15)" fill="url(#wing)" stroke="#2b2118" stroke-width="2.5"/>
  <ellipse cx="39" cy="14" rx="9" ry="12" transform="rotate(20 39 14)" fill="url(#wing)" stroke="#2b2118" stroke-width="2.5"/>
  <!-- valve, where an inflatable toy would have its stinger -->
  <path d="M52 38 L61 35 L61 41 Z" fill="#2b2118"/>
  <circle cx="61" cy="38" r="2.5" fill="#ff7a59" stroke="#2b2118" stroke-width="1.5"/>
  <!-- body with stripes -->
  <ellipse cx="31" cy="38" rx="23" ry="19" fill="url(#body)"/>
  <g clip-path="url(#clip)" fill="#2b2118">
    <path d="M29 15 Q35 38 29 61 L37 61 Q43 38 37 15 Z"/>
    <path d="M44 15 Q50 38 44 61 L51 61 Q57 38 51 15 Z"/>
  </g>
  <ellipse cx="31" cy="38" rx="23" ry="19" fill="none" stroke="#2b2118" stroke-width="2.5"/>
  <!-- shine that makes it look blown up -->
  <ellipse cx="19" cy="28" rx="7" ry="4" transform="rotate(-25 19 28)" fill="#ffffff" opacity="0.85"/>
  <circle cx="27" cy="25" r="1.6" fill="#ffffff" opacity="0.85"/>
  <!-- face -->
  <circle cx="17" cy="38" r="3.6" fill="#2b2118"/>
  <circle cx="18.2" cy="36.8" r="1.2" fill="#ffffff"/>
  <path d="M13 45 Q17 49 22 45" fill="none" stroke="#2b2118" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="11.5" cy="42.5" r="2.2" fill="#ff8a7a" opacity="0.8"/>
  <!-- antennae -->
  <path d="M15 22 Q11 12 6 10" fill="none" stroke="#2b2118" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="6" cy="10" r="2.8" fill="#2b2118"/>
</svg>
