<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dueboard</title>
  <meta name="description" content="Усі дедлайни курсів УКУ в одному списку, нагадування в Telegram і план підготовки до екзаменів.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/board" aria-label="Dueboard, на дошку"><img src="/favicon.svg" alt="" width="32" height="32">Dueboard</a>
    <nav id="nav" hidden>
      <a href="#/board" data-view="board">Дошка</a>
      <a href="#/prep" data-view="prep">Екзамени</a>
      <a href="#/settings" data-view="settings">Налаштування</a>
      <button type="button" id="logout" class="link">Вийти</button>
    </nav>
  </header>
  <main id="main" aria-live="polite"></main>
  <div id="toast" role="status" hidden></div>
</body>
</html>
